name: Backend CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: allmanager
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U postgres' --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DJANGO_DEBUG: '1'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/allmanager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python manage.py test core --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn

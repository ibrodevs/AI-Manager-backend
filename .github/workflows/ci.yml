name: Backend CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: allmanager
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        # Runner options are not parsed by a shell: single quotes do not group arguments.
        options: >-
          --health-cmd=pg_isready
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      DJANGO_DEBUG: '1'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/allmanager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Verify PostgreSQL connection before tests
        run: |
          python - <<'PYTHON'
          import os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"], connect_timeout=5) as conn:
              assert conn.execute("SELECT 1").fetchone() == (1,)
              print("PostgreSQL connection verified")
          PYTHON
      - run: python manage.py test core --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn

  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: PYTHONPATH=legacy/apps/voice/src python -m unittest discover -s legacy/apps/voice/tests -q
  legacy-services:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: '10.33.0'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
